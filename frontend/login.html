<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عيصر - تسجيل الدخول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>window.aysarApi = window.aysarApi || function (p) { return ((window.AYSAR_CONFIG && window.AYSAR_CONFIG.API_BASE) || "") + p; };</script>
<script src="/config.js"></script>
<style>
  :root {
    --bg: #eef1ee;
    --panel: #ffffff;
    --ink: #17252a;
    --muted: #5d6b6f;
    --line: #d3dbd6;
    --accent: #1f4fd8;
    --accent-ink: #ffffff;
    --err: #b3261e;
    --code-bg: #121c21;
    --code-ink: #e2e8f0;
    --code-muted: #82929e;
    --code-key: #38bdf8;
    --code-ok: #4ade80;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f171d;
      --panel: #172228;
      --ink: #e2e8f0;
      --muted: #94a3ad;
      --line: #263842;
      --accent: #38bdf8;
      --accent-ink: #082f49;
      --err: #f2a29c;
      --code-bg: #0b1216;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans Arabic', system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
    display: grid;
    place-items: center;
    padding: 20px;
    line-height: 1.6;
  }
  main {
    width: 100%;
    max-width: 880px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }
  .form-side { padding: 44px 40px; display: flex; flex-direction: column; justify-content: center; }
  h1 { font-size: 30px; font-weight: 700; margin: 0 0 6px; }
  .sub { color: var(--muted); margin: 0 0 28px; font-size: 15px; }
  label { display: block; font-size: 14px; font-weight: 500; margin: 0 0 6px; }
  .field { margin-bottom: 18px; position: relative; }
  input {
    width: 100%;
    font: inherit;
    font-size: 16px;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 11px 13px;
  }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .toggle {
    position: absolute; inset-inline-start: 6px; bottom: 6px;
    font: inherit; font-size: 13px; color: var(--muted);
    background: transparent; border: 0; padding: 6px 8px; cursor: pointer; border-radius: 6px;
  }
  #password { padding-inline-start: 62px; }
  .submit {
    width: 100%; font: inherit; font-size: 16px; font-weight: 600;
    background: var(--accent); color: var(--accent-ink);
    border: 0; border-radius: 8px; padding: 12px; cursor: pointer; margin-top: 4px;
  }
  .submit:disabled { opacity: .6; cursor: wait; }
  .error { min-height: 24px; color: var(--err); font-size: 14px; margin: 0 0 10px; }

  .sample-side {
    background: var(--code-bg);
    color: var(--code-ink);
    padding: 44px 36px;
    display: flex; flex-direction: column; justify-content: center; gap: 22px;
  }
  .sample-side p { margin: 0; color: var(--code-muted); font-size: 14px; }
  .line { font-size: 17px; }
  .line.said { color: var(--code-ink); }
  pre {
    margin: 0; direction: ltr; text-align: left;
    font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace;
    font-size: 15px; color: var(--code-ok);
    border-inline-start: 3px solid var(--code-key);
    padding: 4px 0 4px 14px;
  }
  @media (max-width: 720px) {
    main { grid-template-columns: 1fr; }
    .sample-side { display: none; }
    .form-side { padding: 32px 24px; }
  }
</style>
</head>
<body>
<main>
  <section class="form-side">
    <h1>عيصر</h1>
    <p class="sub">سجّل الدخول لتفتح المحرر.</p>
    <form id="f" novalidate>
      <div class="field">
        <label for="username">اسم المستخدم</label>
        <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
      </div>
      <div class="field">
        <label for="password">كلمة المرور</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="button" class="toggle" id="toggle" aria-controls="password">إظهار</button>
      </div>
      <p class="error" id="err" role="alert" aria-live="polite"></p>
      <button class="submit" id="go" type="submit">دخول</button>
    </form>
  </section>
  <aside class="sample-side" aria-hidden="true">
    <p>تكتب بلغتك، ويكتب المحرر الكود:</p>
    <div class="line said">اطبع مجموع الرقمين خمسة وسبعة</div>
    <pre>print(5 + 7)</pre>
  </aside>
</main>
<script>
  const f = document.getElementById("f"), err = document.getElementById("err"), go = document.getElementById("go");
  const pw = document.getElementById("password"), tg = document.getElementById("toggle");
  tg.addEventListener("click", () => {
    const show = pw.type === "password";
    pw.type = show ? "text" : "password";
    tg.textContent = show ? "إخفاء" : "إظهار";
  });
  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    err.textContent = "";
    const username = f.username.value.trim(), password = f.password.value;
    if (!username || !password) { err.textContent = "أدخل اسم المستخدم وكلمة المرور."; return; }
    go.disabled = true; go.textContent = "جارٍ الدخول...";
    try {
      const r = await fetch(window.aysarApi("/api/auth/login"), {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }), credentials: "same-origin",
      });
      const data = await r.json().catch(() => ({}));
      if (r.ok) { location.replace("/"); return; }
      err.textContent = data.error || "تعذّر تسجيل الدخول.";
    } catch {
      err.textContent = "تعذّر الاتصال بالسيرفر. إذا كان نائماً انتظر دقيقة وأعد المحاولة.";
    }
    go.disabled = false; go.textContent = "دخول";
  });
</script>
</body>
</html>
