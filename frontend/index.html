<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>عيصر - Aysar Code Editor</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700&amp;family=Amiri:ital,wght@0,400;0,700;1,400&amp;family=Cairo:wght@400;600;700&amp;family=Changa:wght@400;600&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&amp;family=Marhey:wght@400;600;700&amp;family=Tajawal:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #eef1ee;
    --panel: #ffffff;
    --activity-bg: #e5ece6;
    --ink: #17252a;
    --muted: #5d6b6f;
    --line: #d3dbd6;
    --accent: #1f4fd8;
    --accent-ink: #ffffff;
    --ok: #17724a;
    --editor-bg: #ffffff;
    --dot-color: #1f4fd8;
    --status-bg: #1f4fd8;
    --status-fg: #ffffff;
    --text-font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif;
    --comment-weight: normal;
    color-scheme: light;
  }
  /* 1. داكن هادئ (Dark Slate) */
  [data-theme="dark-slate"] {
    --bg: #0f171d;
    --panel: #172228;
    --activity-bg: #121c21;
    --ink: #e2e8f0;
    --muted: #82929e;
    --line: #263842;
    --accent: #38bdf8;
    --accent-ink: #082f49;
    --ok: #4ade80;
    --editor-bg: #172228;
    --dot-color: #38bdf8;
    --status-bg: #0b1216;
    --status-fg: #94a3b8;
    color-scheme: dark;
  }
  /* 2. سايبربانك نيون (Cyberpunk / Matrix) */
  [data-theme="cyberpunk"] {
    --bg: #050b07;
    --panel: #0a160f;
    --activity-bg: #060f0a;
    --ink: #a7f3d0;
    --muted: #22c55e;
    --line: #143521;
    --accent: #00ff66;
    --accent-ink: #021a08;
    --ok: #00ff9d;
    --editor-bg: #0a160f;
    --dot-color: #00ff66;
    --status-bg: #030805;
    --status-fg: #00ff66;
    color-scheme: dark;
  }
  /* 3. سيبيا دافئ (Warm Sepia / Coffee) */
  [data-theme="warm-sepia"] {
    --bg: #f4ece1;
    --panel: #fcf9f2;
    --activity-bg: #ece0d1;
    --ink: #43302b;
    --muted: #846d62;
    --line: #dfd2be;
    --accent: #a85832;
    --accent-ink: #ffffff;
    --ok: #2e7d32;
    --editor-bg: #fcf9f2;
    --dot-color: #a85832;
    --status-bg: #a85832;
    --status-fg: #fff7ed;
    color-scheme: light;
  }
  /* 4. سماوي ليلي (Nord / Deep Navy) */
  [data-theme="nord-navy"] {
    --bg: #212733;
    --panel: #293140;
    --activity-bg: #1b212c;
    --ink: #eceff4;
    --muted: #889bb3;
    --line: #3b465c;
    --accent: #88c0d0;
    --accent-ink: #1b222d;
    --ok: #a3be8c;
    --editor-bg: #293140;
    --dot-color: #88c0d0;
    --status-bg: #181d27;
    --status-fg: #d8dee9;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--text-font-family);
    display: flex;
    flex-direction: column;
    padding: 10px;
    gap: 8px;
    transition: background-color 0.25s ease, color 0.25s ease;
    overflow: hidden;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  h1 { font-size: 22px; font-weight: 600; margin: 0; margin-inline-end: auto; display: flex; align-items: center; gap: 6px; }
  .theme-wrapper, .tool-group {
    display: inline-flex;
    align-items: center;
    position: relative;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 0 8px;
    gap: 6px;
    height: 38px;
  }
  .theme-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background-color: var(--dot-color);
    box-shadow: 0 0 6px var(--dot-color);
    transition: background-color 0.25s ease, box-shadow 0.25s ease;
    flex-shrink: 0;
  }
  .theme-icon, .tool-icon {
    font-size: 14px;
    line-height: 1;
    user-select: none;
    display: inline-flex;
    align-items: center;
  }
  .theme-wrapper select, .tool-group select {
    border: none;
    padding-inline-start: 2px;
    background: transparent;
    height: 100%;
  }
  .theme-wrapper select:focus-visible, .tool-group select:focus-visible {
    outline: none;
  }
  .theme-wrapper:focus-within, .tool-group:focus-within {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  select, button {
    font: inherit;
    font-size: 13.5px;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 11px;
    cursor: pointer;
    transition: border-color 0.2s, background-color 0.2s, color 0.2s, box-shadow 0.2s;
    height: 38px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    white-space: nowrap;
  }
  button.primary {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
    font-weight: 600;
  }
  button.primary:hover {
    filter: brightness(1.08);
  }
  button[aria-pressed="true"] {
    border-color: var(--accent);
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 12%, var(--panel));
    box-shadow: 0 0 8px color-mix(in srgb, var(--accent) 25%, transparent);
  }
  button#font-bold[aria-pressed="true"] {
    font-weight: 800;
    border-color: var(--accent);
  }
  /* Pulse animation for sci-fi ambient music active state */
  button#music[aria-pressed="true"] .music-indicator {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--ok);
    box-shadow: 0 0 6px var(--ok);
    animation: aysar-pulse-music 1.4s infinite ease-in-out;
  }
  @keyframes aysar-pulse-music {
    0%, 100% { transform: scale(0.9); opacity: 0.6; }
    50% { transform: scale(1.3); opacity: 1; }
  }
  select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ===== WORKSPACE WITH ACTIVITY BAR ===== */
  #app-body {
    display: flex;
    flex: 1;
    min-height: 0;
    gap: 8px;
    position: relative;
  }

  /* VS Code Activity Bar */
  #activity-bar {
    width: 48px;
    background: var(--activity-bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    flex-shrink: 0;
    user-select: none;
    z-index: 20;
    transition: background-color 0.25s, border-color 0.25s;
  }
  .act-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 100%;
    align-items: center;
  }
  .act-btn {
    width: 40px;
    height: 40px;
    border: none;
    background: transparent;
    border-radius: 6px;
    color: var(--muted);
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    cursor: pointer;
    font-size: 19px;
    transition: color 0.15s, background-color 0.15s;
  }
  .act-btn:hover {
    color: var(--ink);
    background: color-mix(in srgb, var(--accent) 12%, transparent);
  }
  .act-btn.active {
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 15%, transparent);
  }
  .act-btn.active::before {
    content: '';
    position: absolute;
    inset-inline-start: 0;
    top: 8px;
    bottom: 8px;
    width: 3px;
    background: var(--accent);
    border-radius: 2px;
  }
  .act-badge {
    position: absolute;
    top: 4px;
    inset-inline-end: 4px;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 10px;
    font-weight: 700;
    height: 15px;
    min-width: 15px;
    padding: 0 4px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    font-family: "JetBrains Mono", sans-serif;
  }

  /* Main editor area + header tab action bar */
  main {
    flex: 1;
    min-width: 0;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: background-color 0.25s ease, border-color 0.25s ease;
  }
  .editor-header-bar {
    height: 38px;
    background: color-mix(in srgb, var(--panel) 92%, var(--bg));
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10px;
    gap: 8px;
    user-select: none;
    flex-shrink: 0;
  }
  .editor-tabs {
    display: flex;
    align-items: center;
    gap: 4px;
    overflow-x: auto;
    height: 100%;
    scrollbar-width: none;
  }
  .editor-tabs::-webkit-scrollbar { display: none; }
  .editor-tab {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 12px;
    height: 32px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-bottom: none;
    border-radius: 6px 6px 0 0;
    font-size: 13px;
    font-family: "JetBrains Mono", monospace;
    color: var(--ink);
    font-weight: 500;
  }
  .editor-tab-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    display: inline-block;
  }
  .editor-actions {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }
  .editor-act-btn {
    width: 28px;
    height: 28px;
    padding: 0;
    border: 1px solid transparent;
    border-radius: 4px;
    background: transparent;
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .editor-act-btn:hover {
    color: var(--ink);
    background: color-mix(in srgb, var(--accent) 14%, transparent);
    border-color: var(--line);
  }
  .editor-act-btn.run-btn {
    color: var(--ok);
  }
  .editor-act-btn.run-btn:hover {
    background: color-mix(in srgb, var(--ok) 18%, transparent);
  }

  /* مساحة الكود تبقى من اليسار لليمين دائماً */
  .editor-container {
    flex: 1;
    min-height: 0;
    position: relative;
  }
  #editor { width: 100%; height: 100%; direction: ltr; text-align: left; }
  /* تطبيق الخط المخصص للتعليقات والنصوص داخل Monaco Editor */
  .monaco-editor .mtk3,
  .monaco-editor .token.comment,
  .monaco-editor .comment {
    font-family: var(--text-font-family), "JetBrains Mono", monospace !important;
    font-weight: var(--comment-weight) !important;
    letter-spacing: 0.2px;
  }
  /* لمن يكتب تعليقات عربية */
  .monaco-editor [class*="mtk"] {
    font-variant-ligatures: normal;
  }

  /* ===== VS CODE STATUS BAR ===== */
  footer {
    display: flex;
    flex-wrap: nowrap;
    justify-content: space-between;
    font-size: 12px;
    color: var(--status-fg);
    background: var(--status-bg);
    border-radius: 6px;
    padding: 0 10px;
    height: 28px;
    align-items: center;
    overflow: hidden;
    user-select: none;
    box-shadow: 0 1px 4px rgba(0,0,0,0.12);
    font-family: "JetBrains Mono", var(--text-font-family), sans-serif;
  }
  .status-left, .status-right {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 100%;
    min-width: 0;
  }
  .status-item {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 100%;
    padding: 0 6px;
    cursor: pointer;
    border-radius: 3px;
    white-space: nowrap;
    transition: background 0.15s;
    font-size: 11.5px;
  }
  .status-item:hover {
    background: rgba(255,255,255,0.15);
  }
  #status {
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 480px;
    font-size: 11.5px;
  }
  #status.done { color: var(--ok); font-weight: 600; }
  kbd {
    font-family: "JetBrains Mono", ui-monospace, Consolas, monospace;
    font-size: 11px;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 3px;
    padding: 0px 4px;
    background: rgba(0,0,0,0.15);
    color: inherit;
  }
  /* تأثير الضباب على السطر أثناء التحويل */
  .monaco-editor .aysar-fog-line {
    background: linear-gradient(100deg, transparent 0%, color-mix(in srgb, var(--accent) 28%, transparent) 50%, transparent 100%);
    background-size: 250% 100%;
    animation: aysar-sweep 1.6s linear infinite;
  }
  .monaco-editor .aysar-fog-text {
    color: transparent !important;
    text-shadow: 0 0 7px var(--ink);
    animation: aysar-pulse 1.2s ease-in-out infinite;
  }
  @keyframes aysar-sweep { from { background-position: 150% 0; } to { background-position: -50% 0; } }
  @keyframes aysar-pulse {
    0%, 100% { text-shadow: 0 0 5px var(--ink); opacity: .6; }
    50% { text-shadow: 0 0 11px var(--ink); opacity: 1; }
  }
  /* تأثير ظهور الكود بعد التحويل: يتضح من الضباب مع وميض أخضر خفيف */
  .monaco-editor .aysar-reveal-line { animation: aysar-flash 1.2s ease-out; }
  .monaco-editor .aysar-reveal-text { animation: aysar-unblur .8s ease-out; }
  @keyframes aysar-flash { from { background: color-mix(in srgb, var(--ok) 30%, transparent); } }
  @keyframes aysar-unblur { from { color: transparent; text-shadow: 0 0 8px var(--ink); opacity: .3; } }
  /* لمن عنده إعداد "تقليل الحركة" بجهازه: لمعة ثابتة بدون حركة */
  @media (prefers-reduced-motion: reduce) {
    .monaco-editor .aysar-fog-line,
    .monaco-editor .aysar-fog-text,
    .monaco-editor .aysar-reveal-line,
    .monaco-editor .aysar-reveal-text { animation: none; }
    .monaco-editor .aysar-fog-line { background: color-mix(in srgb, var(--accent) 18%, transparent); }
  }
  /* ===== الفضاء + الملفات ===== */
  #btn-space { background: linear-gradient(135deg, #1e1b4b 0%, #4338ca 60%, #0284c7 100%); color: #f0fdf4; border-color: #818cf8; font-weight: 600; }
  #work { display: flex; flex: 1; min-height: 0; gap: 8px; }
  body.in-space #work { display: none; }
  #explorer { width: 270px; flex-shrink: 0; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; font-size: 13px; transition: width 0.2s; }
  #explorer.collapsed { display: none; }
  .ex-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .ex-btns { display: flex; gap: 4px; }
  .ex-head button { height: 26px; padding: 0 8px; font-size: 12px; }
  .ex-folder { margin-top: 10px; padding: 3px 6px; font-weight: 600; cursor: pointer; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
  .ex-folder.cur { color: var(--accent); }
  .ex-file { display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 6px; cursor: pointer; }
  .ex-file:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .ex-file.on { background: color-mix(in srgb, var(--accent) 18%, transparent); }
  .ex-name { font-family: "JetBrains Mono", ui-monospace, Consolas, monospace; direction: ltr; white-space: nowrap; }
  .ex-desc { color: var(--muted); font-size: 12px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ex-desc.none { opacity: .55; font-style: italic; }
  .ex-acts { display: flex; gap: 2px; flex-shrink: 0; }
  .ex-del, .ex-edit { height: 22px; padding: 0 6px; font-size: 11px; opacity: .45; }
  .ex-file:hover .ex-del, .ex-file:hover .ex-edit, .ex-folder:hover .ex-edit { opacity: 1; }
  #info-pop { position: fixed; z-index: 1000; width: 290px; padding: 12px; display: flex; flex-direction: column; gap: 8px; font-size: 13px;
    background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 40px rgba(0,0,0,.45); }
  #info-pop button { height: 32px; }
  .ip-title { font-weight: 600; }
  .ip-label { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 12px; }
  .ip-input { height: 34px; padding: 0 10px; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
  .ip-err { color: #ef4444; font-size: 12px; }
  .ip-row { display: flex; gap: 8px; justify-content: flex-end; }
  @media (max-width: 760px) { #explorer { width: 170px; } }
  #space-view { display: none; flex: 1; min-height: 0; position: relative; overflow: hidden; cursor: grab; user-select: none;
    border: 1px solid var(--line); border-radius: 8px;
    background: radial-gradient(ellipse at 50% 30%, #171038 0%, #0a071d 55%, #020108 100%); }
  body.in-space #space-view { display: block; }
  body.in-space #app-body > #work { display: none; }
  #space-stars { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #space-stage { position: absolute; top: 0; left: 0; width: 0; height: 0; transform-origin: 0 0; }
  .sp-card { position: absolute; display: flex; flex-direction: column; direction: ltr; color: #e2e8f0; border-radius: 14px; cursor: auto; user-select: auto; }
  .sp-head { height: 32px; padding: 0 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; cursor: move; font-size: 12.5px; }
  .sp-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: text; }
  .sp-name { font-family: "JetBrains Mono", ui-monospace, Consolas, monospace; opacity: .9; }
  .sp-desc { opacity: .6; direction: rtl; unicode-bidi: plaintext; }
  .sp-desc.none { opacity: .35; font-style: italic; }
  .sp-actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
  .sp-actions select, .sp-actions button { height: 24px; padding: 0 8px; font-size: 11.5px; border-radius: 5px; color: #e2e8f0; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); }
  .sp-actions select option, .space-hud select option { background: #0d1224; color: #f1f5f9; }
  .sp-body { flex: 1; min-height: 0; overflow: hidden; }
  .sp-resize { position: absolute; right: 0; bottom: 0; width: 16px; height: 16px; cursor: nwse-resize; background: linear-gradient(135deg, transparent 50%, rgba(129,140,248,.7) 50%); }
  .space-hud { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 50; display: flex; align-items: center; gap: 8px;
    padding: 6px 12px; border-radius: 30px; background: rgba(9,12,26,.88); border: 1px solid rgba(129,140,248,.35); backdrop-filter: blur(14px); cursor: default; max-width: 96%; flex-wrap: wrap; justify-content: center; }
  .space-hud button, .space-hud select { height: 32px; border-radius: 20px; padding: 0 12px; font-size: 12.5px; color: #f1f5f9; background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.15); }
  #sp-zoom { color: #94a3b8; font-size: 12px; min-width: 44px; text-align: center; }
  body:not(.frameless) .sp-card { background: rgba(11,15,30,.85); backdrop-filter: blur(18px); border: 1px solid rgba(129,140,248,.35);
    box-shadow: 0 20px 50px -10px rgba(0,0,0,.8), 0 0 30px rgba(99,102,241,.18); overflow: hidden; }
  body:not(.frameless) .sp-card.sel { border-color: #38bdf8; }
  body:not(.frameless) .sp-head { background: rgba(255,255,255,.05); border-bottom: 1px solid rgba(255,255,255,.09); }
  body.frameless .sp-card { background: radial-gradient(ellipse at center, rgba(3,2,8,.62) 0%, rgba(3,2,8,.42) 55%, rgba(3,2,8,0) 100%); border: 1px dashed transparent; }
  body.frameless .sp-card:hover { border-color: rgba(129,140,248,.45); }
  body.frameless .sp-card.sel { border-color: rgba(56,189,248,.6); }
  body.frameless .sp-actions, body.frameless .sp-resize { opacity: 0; transition: opacity .2s; }
  body.frameless .sp-card:hover .sp-actions, body.frameless .sp-card.sel .sp-actions,
  body.frameless .sp-card:focus-within .sp-actions, body.frameless .sp-card:hover .sp-resize { opacity: 1; }
  body.frameless .sp-card .monaco-editor, body.frameless .sp-card .monaco-editor-background,

  .sp-frame { position: absolute; border: 1.5px dashed rgba(129,140,248,.5); border-radius: 18px; background: rgba(99,102,241,.05); pointer-events: none; }
  .sp-frame.cur { border-color: rgba(56,189,248,.8); background: rgba(56,189,248,.06); }
  .fr-head { pointer-events: auto; position: absolute; top: 0; left: 0; right: 0; height: 36px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 12px; cursor: move; color: #cbd5e1; font-size: 13px; font-weight: 600; direction: ltr; }
  .fr-acts { display: flex; gap: 4px; opacity: .45; transition: opacity .2s; }

  .fr-acts button { height: 24px; padding: 0 7px; font-size: 11.5px; border-radius: 5px; color: #e2e8f0; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); }
  .ex-folder.drop, .ex-file.drop { outline: 2px dashed var(--accent); }

  /* ===== الحفظ على القرص ===== */
  .disk-bar { margin: 0 0 8px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: color-mix(in srgb, var(--accent) 5%, transparent);
    font-size: 12px; display: flex; flex-direction: column; gap: 6px; }
  .disk-row { display: flex; gap: 4px; flex-wrap: wrap; }
  .disk-row button, .disk-state button { height: 28px; padding: 0 8px; font-size: 12px; }
  .disk-state { color: var(--muted); display: flex; align-items: center; flex-wrap: wrap; gap: 2px; }
  .disk-state .dirty { color: #f59e0b; font-weight: 600; }
  .disk-state .saved { color: var(--ok); font-weight: 600; }
  .disk-auto { display: flex; align-items: center; gap: 6px; color: var(--muted); cursor: pointer; }

  /* زر الفضاء بشريط الأنشطة */
  #act-space { font-size: 19px; }
  .fab-space { position: fixed; bottom: 46px; inset-inline-start: 16px; z-index: 60; width: 44px; height: 44px; border-radius: 50%; padding: 0; font-size: 20px;
    background: linear-gradient(135deg, #1e1b4b, #4338ca 60%, #0284c7); color: #fff; border: 1px solid #818cf8; box-shadow: 0 6px 20px rgba(0,0,0,.4); }

  /* ===== الجسر المحلي ولوحة المخرجات ===== */
  #run-panel { position: fixed; left: 10px; right: 10px; bottom: 44px; height: 260px; z-index: 900; display: flex; flex-direction: column;
    background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 40px rgba(0,0,0,.45); overflow: hidden; }
  .rp-head { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--line); font-size: 12.5px; direction: ltr; }
  .rp-title { font-family: "JetBrains Mono", ui-monospace, Consolas, monospace; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rp-acts { display: flex; gap: 6px; }
  .rp-acts button, .rp-in button { height: 26px; padding: 0 10px; font-size: 12px; }
  .rp-out { flex: 1; margin: 0; padding: 8px 12px; overflow: auto; font-family: "JetBrains Mono", ui-monospace, Consolas, monospace; font-size: 13px; white-space: pre-wrap; direction: ltr; text-align: left; }
  .rp-err { color: #ef4444; }
  .rp-meta { color: var(--muted); }
  .rp-in { display: flex; gap: 6px; padding: 6px 10px; border-top: 1px solid var(--line); }
  .rp-input { flex: 1; height: 28px; padding: 0 10px; font: inherit; font-size: 13px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; direction: ltr; }

  /* ===== تبويبات + بحث + لوحة الأوامر ===== */
  .editor-tab { cursor: pointer; opacity: .72; transition: opacity .15s; }
  .editor-tab:hover { opacity: 1; }
  .editor-tab.active { opacity: 1; background: var(--panel); border-color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
  .tab-name { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tab-x { height: 18px; min-width: 18px; padding: 0; font-size: 11px; line-height: 1; border: none; background: transparent; border-radius: 4px; opacity: .55; cursor: pointer; color: var(--ink); }
  .tab-x:hover { opacity: 1; background: color-mix(in srgb, var(--ink) 15%, transparent); }
  .tab-x.dirty { color: #f59e0b; opacity: 1; }
  #search-panel { width: 300px; flex-shrink: 0; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; font-size: 13px; }
  .sr-row { display: flex; gap: 4px; margin-bottom: 6px; }
  .sr-input { flex: 1; min-width: 0; height: 30px; padding: 0 8px; font: inherit; font-size: 13px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
  .sr-tog, .sr-all { height: 30px; min-width: 30px; padding: 0 6px; font-size: 12px; }
  .sr-sum { color: var(--muted); font-size: 12px; margin: 4px 2px 8px; }
  .sr-file { margin-top: 8px; font-weight: 600; color: var(--accent); font-size: 12.5px; direction: ltr; text-align: left; }
  .sr-match { display: flex; gap: 8px; padding: 3px 6px; border-radius: 5px; cursor: pointer; direction: ltr; font-family: "JetBrains Mono", ui-monospace, Consolas, monospace; font-size: 12px; }
  .sr-match:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .sr-ln { color: var(--muted); min-width: 24px; text-align: right; }
  .sr-txt { white-space: pre; overflow: hidden; text-overflow: ellipsis; }
  .sr-txt mark { background: color-mix(in srgb, var(--accent) 38%, transparent); color: inherit; border-radius: 2px; }
  #palette-bg { position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,.35); display: flex; justify-content: center; align-items: flex-start; padding-top: 12vh; }
  #palette { width: min(640px, 92vw); background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.5); overflow: hidden; }
  #palette input { width: 100%; height: 46px; border: none; border-bottom: 1px solid var(--line); background: transparent; color: var(--ink); font: inherit; font-size: 15px; padding: 0 16px; outline: none; }
  .pal-list { max-height: 50vh; overflow: auto; }
  .pal-item { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 16px; cursor: pointer; }
  .pal-item.sel { background: color-mix(in srgb, var(--accent) 18%, transparent); }
  .pal-detail { color: var(--muted); font-size: 12px; direction: ltr; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pal-empty { padding: 14px 16px; color: var(--muted); }

  /* ===== الفضاء بنفس مزايا المحرر العادي: القائمة الجانبية (المستكشف/البحث/الحفظ/الجسر) بتضل ظاهرة بجنب الفضاء ===== */
  body.in-space #work, body.in-space #app-body > #work { display: flex !important; flex: 0 0 auto !important; }
  body.in-space #work > main { display: none !important; }
  body.in-space #space-view { flex: 1 1 0; min-width: 0; }
  #sp-save.dirty { color: #f59e0b; border-color: #f59e0b; }
  .aysar-hit { background: color-mix(in srgb, #f59e0b 45%, transparent); border-radius: 2px; }
  .sr-scope { flex: 1; min-width: 0; height: 28px; padding: 0 6px; font-size: 12px; }

  /* ===== مساعد الذكاء: زر "اسأل" + مربع التيرمنال ===== */
  .ai-ask-btn { position: fixed; z-index: 10001; display: none; font: 600 13px "JetBrains Mono", ui-monospace, Consolas, "IBM Plex Sans Arabic", monospace; color: #39ff14; background: #050a08; border: 1px solid #1f6b3a; border-radius: 6px; padding: 5px 11px; cursor: pointer; box-shadow: 0 0 12px rgba(57,255,20,.25); }

  .ai-term { position: fixed; z-index: 10000; right: 24px; bottom: 44px; width: min(580px, calc(100vw - 32px)); max-height: min(80vh, 740px); display: none; flex-direction: column; background: #050a08; color: #b6f5c8; border: 1px solid #1f6b3a; border-radius: 10px; box-shadow: 0 0 0 1px #0b2a18, 0 24px 70px rgba(0,0,0,.65), 0 0 28px rgba(57,255,20,.12); font-family: "JetBrains Mono", ui-monospace, Consolas, "IBM Plex Sans Arabic", monospace; font-size: 14px; line-height: 1.6; overflow: hidden; }
  .ai-bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: #0a140f; border-bottom: 1px solid #123a24; cursor: grab; user-select: none; direction: ltr; }
  .ai-dots { display: flex; gap: 6px; flex: none; }
  .ai-dots span { width: 10px; height: 10px; border-radius: 50%; background: #ff5f56; }
  .ai-dots span:nth-child(2) { background: #ffbd2e; }
  .ai-dots span:nth-child(3) { background: #27c93f; }
  .ai-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #39ff14; font-size: 13px; }
  .ai-x { flex: none; background: transparent; color: #7aa88a; border: 0; font-size: 15px; cursor: pointer; padding: 2px 6px; border-radius: 4px; }
  .ai-x:hover { color: #fff; background: #1a2f22; }
  .ai-code { margin: 0; padding: 10px 12px; max-height: 140px; overflow: auto; background: #030705; border-bottom: 1px solid #123a24; color: #7ee787; font-size: 13px; line-height: 1.5; white-space: pre; direction: ltr; text-align: left; }
  .ai-msgs { flex: 1; min-height: 90px; overflow: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; }
  .ai-m { display: flex; gap: 8px; }
  .ai-tag { flex: none; color: #39ff14; font-weight: 600; direction: ltr; }
  .ai-m.you .ai-tag { color: #7dd3fc; }
  .ai-m.err .ai-tag, .ai-m.err .ai-body { color: #fca5a5; }
  .ai-body { flex: 1; min-width: 0; }
  .ai-p { white-space: pre-wrap; word-break: break-word; margin: 0 0 6px; }
  .ai-reason { color: #fbbf24; margin: 4px 0; }
  .ai-block pre { direction: ltr; text-align: left; margin: 4px 0; padding: 8px 10px; background: #030705; border: 1px solid #123a24; border-radius: 6px; overflow: auto; color: #d1fae5; font-size: 13px; line-height: 1.5; }
  .ai-actions { display: flex; gap: 8px; margin-bottom: 6px; }
  .ai-btn, .ai-send { font: inherit; font-size: 13px; color: #39ff14; background: #08120d; border: 1px solid #1f6b3a; border-radius: 6px; padding: 4px 12px; cursor: pointer; }
  .ai-btn:hover:not(:disabled), .ai-send:hover:not(:disabled) { background: #0f2a1c; }
  .ai-btn:disabled, .ai-send:disabled { opacity: .55; cursor: default; }
  .ai-row { display: flex; align-items: flex-end; gap: 8px; padding: 8px 12px 12px; border-top: 1px solid #123a24; }
  .ai-prompt { color: #39ff14; padding-bottom: 6px; direction: ltr; }
  .ai-in { flex: 1; resize: none; background: #030705; color: #d1fae5; border: 1px solid #1f6b3a; border-radius: 6px; padding: 7px 9px; font: inherit; font-size: 14px; max-height: 120px; }
  .ai-term :focus-visible, .ai-ask-btn:focus-visible { outline: 2px solid #39ff14; outline-offset: 1px; }
  .ai-cursor { animation: ai-blink 1s steps(2) infinite; }
  @keyframes ai-blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .ai-cursor { animation: none; } }
  @media (max-width: 600px) { .ai-term { left: 0 !important; right: 0 !important; top: auto !important; bottom: 0 !important; width: 100%; border-radius: 12px 12px 0 0; max-height: 82vh; } }
  .ai-tools { display: none; flex-wrap: wrap; gap: 8px; padding: 8px 12px; border-bottom: 1px solid #123a24; background: #050a08; }
  .ai-paste { width: 100%; margin: 4px 0; resize: vertical; background: #030705; color: #d1fae5; border: 1px solid #1f6b3a; border-radius: 6px; padding: 7px 9px; font: inherit; font-size: 13px; }
</style>

      walk("", 0);
      s.value = curFolder;
    };
    const applyFolderVisibility = () => layoutFrames();
    const openFile = (c) => { setActive(c); renderFolderSelect(); applyFolderVisibility(); };

    // نافذة صغيرة داخل الصفحة بدل نوافذ المتصفح (prompt/confirm) اللي ممكن تنحجب
    let pop = null, popOutside = null;
    function closePopup() {
      if (pop) { pop.remove(); pop = null; }
      if (popOutside) { document.removeEventListener("mousedown", popOutside, true); popOutside = null; }
    }
    function popup(anchor, o) {
      closePopup();
      const p = h("div", ""); p.id = "info-pop"; pop = p;
      p.appendChild(h("div", "ip-title", o.title));
      const inputs = (o.fields || []).map((f) => {
        const lab = h("label", "ip-label", f.label), inp = h("input", "ip-input");
        inp.value = f.value || ""; inp.placeholder = f.placeholder || "";
        if (f.ltr) inp.dir = "ltr";
        lab.appendChild(inp); p.appendChild(lab); return inp;
      });
      const err = h("div", "ip-err"), row = h("div", "ip-row");
      const ok = h("button", "primary", o.okLabel || L("حفظ", "Save")), no = h("button", "", L("إلغاء", "Cancel"));
      row.append(ok, no); p.append(err, row);
      document.body.appendChild(p);
      const r = anchor.getBoundingClientRect();
      p.style.top = Math.max(8, Math.min(r.bottom + 6, innerHeight - p.offsetHeight - 8)) + "px";
      p.style.left = Math.max(8, Math.min(r.left, innerWidth - p.offsetWidth - 8)) + "px";
      const done = (save) => {
        if (save) { const msg = o.onSave(inputs.map((i) => i.value.trim())); if (msg) { err.textContent = msg; return; } }
        closePopup();
        if (!save && o.onCancel) o.onCancel();
      };
      ok.onclick = () => done(true); no.onclick = () => done(false);
      p.addEventListener("keydown", (e) => { e.stopPropagation(); if (e.key === "Enter") { e.preventDefault(); done(true); } else if (e.key === "Escape") done(false); });
      const outside = (e) => { if (pop && !pop.contains(e.target)) closePopup(); };
      popOutside = outside;
      setTimeout(() => { if (pop === p) document.addEventListener("mousedown", outside, true); }, 0);
      if (inputs[0]) { inputs[0].focus(); inputs[0].select(); } else ok.focus();
    }

    // الوصف = تعليق أول سطر: نعدّله أو نضيفه أو نحذفه بتعديل بسيط على الملف (بيحافظ على التراجع Undo)
    function setDesc(c, text) {
      const m = c.model, t = text.trim();
      const has = CM[c.lang].test(m.getLineContent(1).trim());
      const nl = t && LG[c.lang].make ? LG[c.lang].make(t) : "";
      let op = null;
      if (has && nl) op = { range: new monaco.Range(1, 1, 1, m.getLineMaxColumn(1)), text: nl };
      else if (has) op = { range: m.validateRange(new monaco.Range(1, 1, 2, 1)), text: "" };
      else if (nl) op = { range: new monaco.Range(1, 1, 1, 1), text: nl + "\n" };
      if (!op) return;
      m.pushStackElement();
      m.pushEditOperations([], [op], () => null);
      m.pushStackElement();
    }

    function editInfo(c, anchor) {
      popup(anchor, {
        title: L("تعديل الملف", "Edit file"),
        fields: [
          { label: L("اسم الملف", "File name"), value: c.name, ltr: true },
          ...(LG[c.lang].re ? [{ label: L("وصف قصير (بيُكتب كتعليق بأول سطر)", "Short description (written as the first-line comment)"), value: descOf(c), placeholder: L("مثال: يحرك الصوت", "e.g. moves the sound") }] : [])
        ],
        onSave: (v) => {
          const n = v[0];
          if (!n) return L("اسم الملف مطلوب.", "File name is required.");
          if (cards.some((x) => x !== c && x.folder === c.folder && x.name === n)) return L("يوجد ملف بنفس الاسم بهذا المجلد.", "A file with this name already exists in this folder.");
          c.name = n;
          if (v.length > 1 && v[1] !== descOf(c)) setDesc(c, v[1]);
          updTitle(c); scheduleEx(); saveAll();
        }
      });
    }

    function editFolder(old, anchor) {
      popup(anchor, {
        title: L("تغيير اسم المجلد", "Rename folder"),
        fields: [{ label: L("اسم المجلد", "Folder name"), value: baseName(old) }],
        onSave: (v) => {
          const n = v[0];
          if (!n) return L("اسم المجلد مطلوب.", "Folder name is required.");
          if (n.includes("/")) return L("الاسم ما يحتوي على /", "The name cannot contain /");
          const np = parentOf(old) ? parentOf(old) + "/" + n : n;
          if (np === old) return;
          if (folders.includes(np)) return L("يوجد مجلد بنفس الاسم هون.", "A folder with this name already exists here.");
          remapFolder(old, np);
        }
      });
    }

    function setLang(c, v) {
      c.lang = v;
      monaco.editor.setModelLanguage(c.model, v);
      c.name = c.name.replace(/\.[A-Za-z0-9]+$/, "." + EXT[v]);
      c.el.querySelector(".sp-lang").value = v;
      if (c === active) $("lang").value = v;
      updTitle(c); syncBars(c); scheduleEx(); saveAll();
    }

    // ===== إطارات المجلدات بالفضاء: كل مجلد إطار بيحيط بملفاته وبمجلداته الفرعية =====
    const hasContent = (f) => cards.some((c) => inTree(c.folder, f));
    // لما مجلد يفضى (نقل أو حذف ملفات)، بنثبّت إطاره مكانه بدل ما يقفز لمكان ثاني
    function withPlaces(fn) {
      const snap = {}, had = {};
      folders.forEach((f) => { snap[f] = frameBox(f); had[f] = hasContent(f); });
      fn();
      folders.forEach((f) => { if (had[f] && snap[f] && !hasContent(f)) fpos[f] = { x: snap[f].x1, y: snap[f].y1 }; });
    }
    function frameBox(f, skip) {
      let b = null;
      const add = (x1, y1, x2, y2) => { b = b ? { x1: Math.min(b.x1, x1), y1: Math.min(b.y1, y1), x2: Math.max(b.x2, x2), y2: Math.max(b.y2, y2) } : { x1: x1, y1: y1, x2: x2, y2: y2 }; };
      cards.forEach((c) => { if (c.folder === f && c !== skip) add(c.x, c.y, c.x + c.w, c.y + c.h); });
      childFolders(f).forEach((k) => { const cb = frameBox(k, skip); add(cb.x1, cb.y1, cb.x2, cb.y2); });
      if (!b) { const p = fpos[f] || { x: 80, y: 60 }; return { x1: p.x, y1: p.y, x2: p.x + EW, y2: p.y + EH }; }
      return { x1: b.x1 - PAD, y1: b.y1 - TOP, x2: b.x2 + PAD, y2: b.y2 + PAD };
    }
    function allBox() {
      let b = null;
      childFolders("").filter((f) => hasContent(f) || fpos[f]).forEach((f) => {
        const fb = frameBox(f);
        b = b ? { x1: Math.min(b.x1, fb.x1), y1: Math.min(b.y1, fb.y1), x2: Math.max(b.x2, fb.x2), y2: Math.max(b.y2, fb.y2) } : fb;
      });
      return b;
    }
    function makeFrame() {
      const el = h("div", "sp-frame"), head = h("div", "fr-head"), acts = h("span", "fr-acts");
      const mk = (txt, fn) => { const b = h("button", "", txt); b.onclick = (e) => { e.stopPropagation(); fn(el.dataset.path, e.currentTarget); }; acts.appendChild(b); };
      mk("📄+", (p) => addCard(undefined, undefined, p));
      mk("📁+", (p, a) => newFolder(a, p));
      mk("✎", (p, a) => editFolder(p, a));
      mk("✕", (p, a) => deleteFolder(p, a));
      mk("🔍", (p) => { if (window.AysarSearch) window.AysarSearch.openIn(p); });
      head.append(h("span", "fr-name"), acts);
      head.addEventListener("mousedown", (e) => { if (!e.target.closest("button")) startFolderDrag(el.dataset.path, e); });
      el.appendChild(head); stage.appendChild(el);
      return el;
    }
    function layoutFrames() {
      folders.forEach((f) => {
        const el = frames[f] || (frames[f] = makeFrame());
        el.dataset.path = f;
        const b = frameBox(f);
        el.style.cssText = "left:" + b.x1 + "px;top:" + b.y1 + "px;width:" + (b.x2 - b.x1) + "px;height:" + (b.y2 - b.y1) + "px;z-index:" + (f.split("/").length - 1);
        el.classList.toggle("cur", f === curFolder);
        el.querySelector(".fr-name").textContent = "📁 " + baseName(f);
        const bs = el.querySelectorAll(".fr-acts button");
        bs[0].title = L("ملف جديد داخل هذا المجلد", "New file in this folder");
        bs[1].title = L("مجلد جديد داخل هذا المجلد", "New folder in this folder");
        bs[2].title = L("تغيير اسم المجلد", "Rename folder");
        bs[3].title = L("حذف المجلد", "Delete folder");
        bs[4].title = L("بحث في هذا المجلد", "Search in this folder");
      });
      Object.keys(frames).forEach((f) => { if (!folders.includes(f)) { frames[f].remove(); delete frames[f]; } });
    }
    function startFolderDrag(path, e) {
      curFolder = path; renderFolderSelect(); renderExplorer();
      drag = { mode: "fmove", sx: e.clientX, sy: e.clientY,
        cs: cards.filter((c) => inTree(c.folder, path)).map((c) => ({ c: c, ox: c.x, oy: c.y })),
        fp: Object.keys(fpos).filter((k) => inTree(k, path)).map((k) => ({ k: k, ox: fpos[k].x, oy: fpos[k].y })) };
    }
    function frameAt(x, y) {
      let best = null, area = 1e18;
      folders.forEach((f) => {
        const b = frameBox(f);
        if (x >= b.x1 && x <= b.x2 && y >= b.y1 && y <= b.y2) { const a = (b.x2 - b.x1) * (b.y2 - b.y1); if (a < area) { area = a; best = f; } }
      });
      return best;
    }
    // مكان فاضي داخل المجلد لملف جديد: يمين المحتوى (أو داخل إطار المجلد الفاضي)
    function slotIn(folder) {
      if (!hasContent(folder)) { const p = fpos[folder] || { x: 80, y: 60 }; return { x: p.x + PAD, y: p.y + TOP }; }
      const b = frameBox(folder);
      if (cards.some((k) => k.folder === folder)) return { x: b.x2 - PAD + 24, y: b.y1 + TOP };
      return { x: b.x1 + PAD, y: b.y2 - PAD + 24 };
    }
    function placeFolder(path) {
      const parent = parentOf(path);
      if (parent) { const pb = frameBox(parent); fpos[path] = { x: pb.x1 + PAD, y: pb.y2 + 20 }; }
      else { const ab = allBox(); fpos[path] = ab ? { x: ab.x2 + 80, y: ab.y1 } : { x: 80, y: 60 }; }
    }
    const ensureFpos = () => folders.slice().sort((a, b) => a.length - b.length).forEach((f) => { if (!hasContent(f) && !fpos[f]) placeFolder(f); });
    function fit(b) {
      const r = spView.getBoundingClientRect(), w = b.x2 - b.x1, hh = b.y2 - b.y1;
      view.z = Math.min(1.05, Math.max(0.3, Math.min((r.width - 140) / w, (r.height - 160) / hh)));
      view.x = r.width / 2 - (b.x1 + w / 2) * view.z; view.y = r.height / 2 - (b.y1 + hh / 2) * view.z;
      applyView();
    }
    const center = () => { const b = allBox(); if (b) fit(b); else { view = { x: 60, y: 40, z: 1 }; applyView(); } };
    const focusFolder = () => fit(frameBox(curFolder));
    function ensureVisible(c) {
      if (!inSpace) return;
      const r = spView.getBoundingClientRect(), sx = c.x * view.z + view.x, sy = c.y * view.z + view.y;
      if (sx < 0 || sy < 0 || sx + 120 > r.width || sy + 60 > r.height) {
        view.x = r.width / 2 - (c.x + c.w / 2) * view.z; view.y = r.height / 2 - (c.y + c.h / 2) * view.z; applyView();
      }
    }
    function shiftTree(path, dx, dy) {
      folders.filter((f) => inTree(f, path) && !hasContent(f) && !fpos[f]).forEach((f) => { fpos[f] = { x: 80, y: 60 }; });
      cards.forEach((c) => { if (inTree(c.folder, path)) { c.x += dx; c.y += dy; c.el.style.left = c.x + "px"; c.el.style.top = c.y + "px"; } });
      Object.keys(fpos).forEach((k) => { if (inTree(k, path)) fpos[k] = { x: fpos[k].x + dx, y: fpos[k].y + dy }; });
    }

    // ===== نقل الملفات والمجلدات =====
    function moveFile(c, target, relocate) {
      if (c.folder === target) return;
      let n = c.name;
      if (cards.some((x) => x !== c && x.folder === target && x.name === n)) {
        const m = n.match(/^(.*?)(\.[^.]*)?$/); let i = 2;
        do { n = m[1] + "-" + i + (m[2] || ""); i++; } while (cards.some((x) => x !== c && x.folder === target && x.name === n));
      }
      withPlaces(() => {
        const slot = relocate ? slotIn(target) : null;
        c.name = n; c.folder = target;
        if (slot) { c.x = slot.x; c.y = slot.y; c.el.style.left = c.x + "px"; c.el.style.top = c.y + "px"; }
      });
      collapsed.delete(target); saveCollapsed();
      updTitle(c); renderFolderSelect(); renderExplorer(); saveAll(); layoutFrames();
      say(L("نُقل الملف إلى ", "File moved to ") + target.replace(/\//g, " / "), true);
    }
    function dropCard(c, e) {
      const r = spView.getBoundingClientRect(), px = (e.clientX - r.left - view.x) / view.z, py = (e.clientY - r.top - view.y) / view.z;
      const ownEmpty = !cards.some((k) => k !== c && inTree(k.folder, c.folder));
      let best = null, area = 1e18;
      folders.forEach((f) => {
        if (ownEmpty && inTree(c.folder, f)) return;   // لو هو الملف الوحيد بمجلده ما بنطلّعه لفوق بالغلط
        const b = frameBox(f, c);
        if (px >= b.x1 && px <= b.x2 && py >= b.y1 && py <= b.y2) { const a = (b.x2 - b.x1) * (b.y2 - b.y1); if (a < area) { area = a; best = f; } }
      });
      if (best && best !== c.folder) moveFile(c, best, false);
    }
    function remapFolder(old, np) {
      const mp = (p) => (inTree(p, old) ? np + p.slice(old.length) : p);
      folders = folders.map(mp);
      cards.forEach((c) => { c.folder = mp(c.folder); });
      curFolder = mp(curFolder);
      const cs = Array.from(collapsed).map(mp); collapsed.clear(); cs.forEach((x) => collapsed.add(x)); saveCollapsed();
      Object.keys(fpos).forEach((k) => { const nk = mp(k); if (nk !== k) { fpos[nk] = fpos[k]; delete fpos[k]; } });
      renderFolderSelect(); renderExplorer(); saveAll(); layoutFrames();
    }
    function moveFolder(path, tp) {
      if (tp === parentOf(path) || inTree(tp, path)) return;
      const np = tp ? tp + "/" + baseName(path) : baseName(path);
      if (folders.includes(np)) { say(L("يوجد مجلد بنفس الاسم بالوجهة.", "A folder with this name already exists there."), false); return; }
      const sb = frameBox(path), ab = allBox();
      const tgt = tp ? slotIn(tp) : (ab ? { x: ab.x2 + 80, y: ab.y1 } : { x: 80, y: 60 });
      shiftTree(path, tgt.x - sb.x1, tgt.y - sb.y1);
      remapFolder(path, np);
      if (tp) { collapsed.delete(tp); saveCollapsed(); }
      renderExplorer();
      say(L("نُقل المجلد.", "Folder moved."), true);
    }
    function deleteFolder(path, anchor) {
      const n = cards.filter((c) => inTree(c.folder, path)).length;
      popup(anchor, {
        title: L("حذف المجلد " + path.replace(/\//g, " / ") + " وكل ما بداخله (" + n + " ملف)؟", "Delete folder " + path + " and everything inside (" + n + " files)?"),
        okLabel: L("حذف", "Delete"), onSave: () => doDeleteFolder(path)
      });
    }
    function doDeleteFolder(path) { withPlaces(() => doDeleteFolder2(path)); }
    function doDeleteFolder2(path) {
      Sound.click();
      const gone = cards.filter((c) => inTree(c.folder, path));
      folders = folders.filter((f) => !inTree(f, path));
      Object.keys(fpos).forEach((k) => { if (inTree(k, path)) delete fpos[k]; });
      Array.from(collapsed).forEach((k) => { if (inTree(k, path)) collapsed.delete(k); });
      if (!folders.length) folders.push("مشروعي");
      if (inTree(curFolder, path)) curFolder = folders.includes(parentOf(path)) ? parentOf(path) : childFolders("")[0];
      if (cards.every((c) => gone.includes(c))) addCard(undefined, undefined, curFolder);   // دايماً بيضل ملف واحد على الأقل
      if (gone.includes(active)) setActive(cards.find((c) => !gone.includes(c)));
      gone.forEach((c) => { c.ed.dispose(); c.model.dispose(); c.el.remove(); });
      cards = cards.filter((c) => !gone.includes(c));
      saveCollapsed(); renderFolderSelect(); renderExplorer(); saveAll(); layoutFrames();
    }

    function newFolder(anchor, parent) {
      parent = parent || "";
      popup(anchor, {
        title: parent ? L("مجلد جديد داخل ", "New folder inside ") + parent.replace(/\//g, " / ") : L("مجلد جديد (بالجذر)", "New top-level folder"),
        fields: [{ label: L("اسم المجلد", "Folder name"), value: "" }],
        onSave: (v) => {
          const n = v[0];
          if (!n) return L("اسم المجلد مطلوب.", "Folder name is required.");
          if (n.includes("/")) return L("الاسم ما يحتوي على /", "The name cannot contain /");
          const path = parent ? parent + "/" + n : n;
          if (folders.includes(path)) return L("يوجد مجلد بنفس الاسم هون.", "A folder with this name already exists here.");
          placeFolder(path); folders.push(path); curFolder = path; collapsed.delete(parent); saveCollapsed();
          renderFolderSelect(); renderExplorer(); saveAll(); layoutFrames(); focusFolder();
        }
      });
    }

    function renderExplorer() {
      const box = $("explorer"); box.innerHTML = "";
      const head = h("div", "ex-head"), bt = h("span", "ex-btns");
      head.appendChild(h("b", "", L("المستكشف", "EXPLORER")));
      const addF = h("button", "", L("+ ملف", "+ File")); addF.title = L("ملف جديد بالمجلد الحالي", "New file in the current folder");
      addF.onclick = () => addCard();
      const addD = h("button", "", L("+ مجلد", "+ Folder")); addD.title = L("مجلد جديد بالجذر", "New top-level folder");
      addD.onclick = (e) => newFolder(e.currentTarget, "");
      bt.append(addF, addD); head.appendChild(bt); box.appendChild(head);
      if (window.AysarDisk) window.AysarDisk.renderBar(box);
      // إفلات مجلد على خلفية القائمة = نقله للجذر
      box.ondragover = (e) => { if (exDrag && exDrag.kind === "folder") e.preventDefault(); };
      box.ondrop = (e) => { e.preventDefault(); const d = exDrag; exDrag = null; if (d && d.kind === "folder") moveFolder(d.path, ""); };
      childFolders("").forEach((f) => renderNode(box, f, 0));
    }

    function renderNode(box, folder, depth) {
      const open = !collapsed.has(folder);
      const fh = h("div", "ex-folder" + (folder === curFolder ? " cur" : ""));
      fh.style.paddingInlineStart = (6 + depth * 14) + "px";
      const acts = h("span", "ex-acts");
      const bF = h("button", "ex-edit", "📄+"), bD = h("button", "ex-edit", "📁+"), bE = h("button", "ex-edit", "✎"), bX = h("button", "ex-edit", "✕"), bS = h("button", "ex-edit", "🔍");
      bF.title = L("ملف جديد داخل هذا المجلد", "New file in this folder");
      bD.title = L("مجلد جديد داخل هذا المجلد", "New folder in this folder");
      bE.title = L("تغيير اسم المجلد", "Rename folder");
      bX.title = L("حذف المجلد", "Delete folder");
      bF.onclick = (e) => { e.stopPropagation(); collapsed.delete(folder); saveCollapsed(); addCard(undefined, undefined, folder); };
      bD.onclick = (e) => { e.stopPropagation(); newFolder(e.currentTarget, folder); };
      bE.onclick = (e) => { e.stopPropagation(); editFolder(folder, e.currentTarget); };
      bX.onclick = (e) => { e.stopPropagation(); deleteFolder(folder, e.currentTarget); };
      bS.title = L("بحث في هذا المجلد", "Search in this folder");
      bS.onclick = (e) => { e.stopPropagation(); if (window.AysarSearch) window.AysarSearch.openIn(folder); };
      acts.append(bF, bD, bE, bX, bS);
      fh.append(h("span", "", (open ? "▾ " : "▸ ") + "📁 " + baseName(folder)), acts);
      fh.onclick = () => {
        if (open) collapsed.add(folder); else collapsed.delete(folder);
        saveCollapsed(); curFolder = folder;
        renderFolderSelect(); renderExplorer(); saveAll(); layoutFrames();
      };
      // سحب وإفلات: اسحب ملف أو مجلد وأفلته على مجلد لنقله
      fh.draggable = true;
      fh.ondragstart = (e) => { exDrag = { kind: "folder", path: folder }; if (e.dataTransfer) { e.dataTransfer.setData("text/plain", folder); e.dataTransfer.effectAllowed = "move"; } };
      fh.ondragend = () => { exDrag = null; };
      fh.ondragover = (e) => { if (exDrag) { e.preventDefault(); fh.classList.add("drop"); } };
      fh.ondragleave = () => fh.classList.remove("drop");
      fh.ondrop = (e) => {
        e.preventDefault(); e.stopPropagation(); fh.classList.remove("drop");
        const d = exDrag; exDrag = null;
        if (!d) return;
        if (d.kind === "file") moveFile(d.c, folder, true); else moveFolder(d.path, folder);
      };
      box.appendChild(fh);
      if (!open) return;
      childFolders(folder).forEach((f) => renderNode(box, f, depth + 1));
      cards.filter((c) => c.folder === folder).sort((a, b) => cmp(a.name, b.name)).forEach((c) => {
        const row = h("div", "ex-file" + (c === active ? " on" : ""));
        row.style.paddingInlineStart = (8 + (depth + 1) * 14) + "px";
        const nm = h("span", "ex-name", c.name);
        const d = descOf(c);

  /* ===== مساعد الذكاء الاصطناعي: حدّد أسطراً ثم "اسأل" ← مربع تيرمنال + محادثة + نسخ/تطبيق + سجل AI-LOG.md ===== */

    // ---------- مطابقة مسافة بداية الأسطر مع الأصل ----------
    const lead = (l) => l.match(/^[ \t]*/)[0];
    function minIndent(text) {
      let best = null;
      text.split("\n").forEach((l) => { if (!l.trim()) return; const w = lead(l); if (best === null || w.length < best.length) best = w; });
      return best === null ? "" : best;
    }
    function rebase(code, orig) {
      const want = minIndent(orig), have = minIndent(code);
      if (want === have) return code;
      return code.split("\n").map((l) => (l.trim() ? want + (l.startsWith(have) ? l.slice(have.length) : l.replace(/^[ \t]*/, "")) : l)).join("\n");
    }

    // ---------- وضع المشروع: يرى أسماء الملفات والمجلدات فقط ----------
    const EXT = { py: "python", js: "javascript", dart: "dart", ts: "typescript", css: "css", html: "html", htm: "html", md: "markdown", yml: "yaml", yaml: "yaml", json: "json", txt: "plaintext" };
    const extLang = (path) => EXT[(String(path).split(".").pop() || "").toLowerCase()] || "";
    function curFolderName() { return String(P.activeFolder() || P.folders()[0] || ""); }

    function cleanPath(p) {
      p = String(p || "").replace(/\\/g, "/").replace(/\/+/g, "/").replace(/^\/|\/$/g, "").trim();
      const segs = p.split("/").map((x) => x.trim());
      if (!p || segs.length > 8) return null;
      for (const x of segs) if (!x || x === "." || x === ".." || x.length > 60 || /[<>:"|?*\u0000-\u001f]/.test(x)) return null;
      return segs.join("/");
    }
    function actionLabel(x) { return (x.type === "create_folder" ? T("إنشاء مجلد ", "Create folder ") : T("إنشاء ملف ", "Create file ")) + x.path; }
    function runAction(x) {
      const path = cleanPath(x.path);
      if (!path) return { ok: false, msg: T("مسار غير صالح: ", "Invalid path: ") + x.path };
      if (x.type === "create_folder") {
        if (P.folders().includes(path)) return { ok: false, exists: true, msg: T("المجلد موجود مسبقاً: ", "Folder already exists: ") + path };
        P.addFolder(path);
        return { ok: true, msg: T("إنشاء مجلد ", "Created folder ") + path };
      }
      if (x.type === "create_file") {
        const i = path.lastIndexOf("/"), folder = i < 0 ? "" : path.slice(0, i), name = path.slice(i + 1);
        if (!name.includes(".")) return { ok: false, msg: T("اسم الملف بلا امتداد: ", "File name has no extension: ") + name };
        const lang = extLang(name);
        if (!lang) return { ok: false, msg: T("امتداد غير مدعوم: ", "Unsupported extension: ") + name };
        if (P.files().some((f) => f.folder === folder && f.name === name)) return { ok: false, exists: true, msg: T("الملف موجود مسبقاً: ", "File already exists: ") + path };
        P.addFile({ folder, name, lang, code: String(x.content || "") });
        return { ok: true, msg: T("إنشاء ملف ", "Created file ") + path };
      }
      return { ok: false, msg: T("نوع خطوة غير مدعوم", "Unsupported step") };
    }
    function applyAction(x, b) {

      if (res.ok) {
        b.disabled = true;
        b.textContent = T("✓ تم", "✓ Done");

    // ---------- تصدير المشروع لنموذج آخر + لصق سجله ----------
    const MAX_EXPORT = 400000;
    const TS_RE = /^\d{4}-\d\d-\d\d \d\d:\d\d:\d\d$/;
    function fenceFor(code) {
      let n = 3;
      (code.match(/`+/g) || []).forEach((r) => { if (r.length >= n) n = r.length + 1; });
      return "`".repeat(n);
    }
    function buildExport() {
      const all = P.files().slice().sort((a, b) => (a.folder + "/" + a.name).localeCompare(b.folder + "/" + b.name));
      const files = all.filter((f) => f.name !== LOG_NAME);
      const tree = projectPaths().join("\n");
      let head = "# Aysar project export\n\n> Generated: " + ts() + " | Files: " + files.length + "\n\n" +
        "## Instructions for the AI model (read this first)\n\n" +
        "You are helping a student with a code project exported from the \"Aysar\" code editor. The whole project is below: first the folder tree, then every file with its full content (the log file " + LOG_NAME + " is left out). You can NOT modify the project directly. Reply in the language the student writes in (Arabic by default).\n\n" +
        "How to deliver changes:\n" +
        "- For every file you change or add, give the COMPLETE new content of that file under a heading `### FILE: <full path>` followed by one fenced code block, so the student can paste it into the editor.\n" +
        "- Do not touch files the student did not ask about, and do not invent files that are not shown here.\n\n" +
        "REQUIRED: keep an activity log. At the very end of EVERY reply, add a section titled `## AI-LOG` with one line per step you took, exactly in this format:\n\n" +
        "- YYYY-MM-DD HH:MM:SS | <your model name> | <action> | <full path of the file, or the word project> | <short reason>\n\n" +
        "Allowed values for <action>: `اقتراح` (you proposed a change or a new file) or `رد بدون تعديل` (you only answered a question). If you do not know the current date and time, write ? in its place. The student will paste this section into the editor's log.\n\n" +
        "## Project tree (folders end with /)\n\n```\n" + tree + "\n```\n\n## Files\n";
      let out = head, omitted = [], count = 0;
      files.forEach((f) => {
        const path = (f.folder ? f.folder + "/" : "") + f.name, code = String(f.code || ""), fc = fenceFor(code);
        const block = "\n### FILE: " + path + "\n\n" + fc + (f.lang && f.lang !== "plaintext" ? f.lang : "") + "\n" + code + "\n" + fc + "\n";
        if (out.length + block.length > MAX_EXPORT) omitted.push(path);
        else { out += block; count++; }
      });
      if (omitted.length) out += "\n## Files omitted because the export is too large\n\n" + omitted.map((x) => "- " + x).join("\n") + "\n";
      return { text: out, count, omitted };
    }
    function download(name, text) {
      const blob = new Blob([text], { type: "text/markdown;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = h("a");
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }
    async function exportProject(how) {
      const ex = buildExport();
      const kb = Math.max(1, Math.round(ex.text.length / 1024));
      let ok = true;
      if (how === "copy") ok = await copyText(ex.text);
      else { try { download("aysar-project.md", ex.text); } catch (e) { ok = false; } }
      if (!ok) { line("err", T("تعذّر تجهيز الملف.", "Could not prepare the file.")); return; }
      let msg = (how === "copy" ? T("نسخت المشروع", "Copied the project") : T("نزّلت الملف aysar-project.md", "Downloaded aysar-project.md")) + ": " + ex.count + " " + T("ملف", "files") + ", ≈" + kb + " KB. " +
        T("أعطه لنموذج آخر، وسيُنهي كل رد بقسم AI-LOG تلصقه هنا بزر \"لصق سجل نموذج آخر\".", "Give it to another AI; it will end each reply with an AI-LOG section you can paste here with \"Paste another AI's log\".");
      if (ex.omitted.length) msg += "\n" + T("تنبيه: حُذفت من الملف لكبر الحجم: ", "Note: omitted because of size: ") + ex.omitted.join(", ");
      else if (kb > 300) msg += "\n" + T("تنبيه: الملف كبير وقد يتجاوز حد بعض النماذج.", "Note: the file is large and may exceed some models' limits.");

      logOp(T("أنت", "You"), T("تصدير المشروع", "Exported project"), ex.count + " " + T("ملف", "files") + ", " + kb + " KB" + (ex.omitted.length ? " | " + T("محذوف لكبر الحجم: ", "omitted: ") + ex.omitted.length : ""));

    function externalEntries(text) {
      const out = [];
      String(text).split(/\r?\n/).forEach((raw) => {

        }

    }
    function openPaste() {

    const pb = document.getElementById("btn-ai-project");

    // ---------- سجل AI-LOG.md (سطر لكل عملية) ----------
    const p2 = (n) => String(n).padStart(2, "0");
    function ts() {
      const d = new Date();
      return d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate()) + " " + p2(d.getHours()) + ":" + p2(d.getMinutes()) + ":" + p2(d.getSeconds());
    }
    function logOp(who, action, detail, code, codeLang) {
      if (!S || !S.file || S.file.name === LOG_NAME) return;
      const rg = curRange();
      const full = (S.file.folder ? S.file.folder + "/" : "") + S.file.name;
      const where = S.mode === "project"
        ? T("المشروع", "project") + (S.file.folder ? " (" + S.file.folder + ")" : "")
        : full + (rg ? ":" + rg.a + "-" + rg.b : "");
      const one = String(detail || "").replace(/\s+/g, " ").trim().slice(0, 500);
      let entry = "- " + ts() + " | " + who + " | " + action + " | " + where + (one ? " | " + one : "");
      if (code) {
        const fence = code.includes("```") ? "~~~~" : "```";
        const lg = codeLang !== undefined ? codeLang : S.file.lang;
        const lang = lg && lg !== "plaintext" ? lg : "";
        entry += "\n" + (fence + lang + "\n" + code + "\n" + fence).split("\n").map((l) => "  " + l).join("\n");
      }
      writeLog(entry);
    }
    // ملف سجل واحد للمشروع كله: في مجلد المشروع الأعلى (الجذر)، لا في مجلد الملف الذي حدث فيه التغيير
    function logHome() {
      const exist = P.files().find((x) => x.name === LOG_NAME && x.folder && !x.folder.includes("/"));
      if (exist) return exist.folder; // لو يوجد سجل بالجذر نكمل عليه دائماً
      const top = P.folders().find((f) => f && !f.includes("/"));
      return top || String((S && S.file && S.file.folder) || "").split("/")[0];
    }
    function writeLog(entry) {
      try {
        const root = logHome();
        const ex = P.files().find((x) => x.folder === root && x.name === LOG_NAME);
        if (ex) P.updateFile(root, LOG_NAME, ex.code.replace(/\s+$/, "") + "\n" + entry + "\n");
        else P.addFile({ folder: root, name: LOG_NAME, lang: "markdown", code: "<!-- " + T("سجل عمليات الذكاء الاصطناعي: يُكتب تلقائياً، سطر لكل عملية", "AI operations log: written automatically, one line per operation") + " -->\n\n" + entry + "\n" });
      } catch (e) { console.warn("AI log failed:", e); }
    }

    window.AysarAI = { project: openProject, open: (ed) => openFor(ed || (window.__activeEditor && window.__activeEditor())), close: closeSession };
  })();
</script>
<script>
(() => {
  const out = document.getElementById("btn-logout"), all = document.getElementById("btn-logout-all");
  if (!out || !all) return;
  const label = () => {
    const en = document.documentElement.lang === "en";
    out.textContent = en ? "Log out" : "خروج";
    out.title = en ? "Log out" : "تسجيل الخروج";
    all.textContent = en ? "End all sessions" : "إنهاء كل الجلسات";
    all.title = en ? "Log out on every device" : "إنهاء كل الجلسات على كل الأجهزة";
  };
  new MutationObserver(label).observe(document.documentElement, { attributes: true, attributeFilter: ["lang"] });
  label();
  const post = async (path) => { try { await fetch(window.aysarApi(path), { method: "POST", credentials: "same-origin" }); } catch (e) {} };
  out.addEventListener("click", async () => { await post("/api/auth/logout"); location.replace("/login"); });
  all.addEventListener("click", async () => {
    const en = document.documentElement.lang === "en";
    if (!confirm(en ? "End all sessions on every device (including this one)?" : "إنهاء كل الجلسات على كل الأجهزة (بما فيها هذا الجهاز)؟")) return;
    await post("/api/auth/logout-all");
    location.replace("/login");
  });
})();
</script>
